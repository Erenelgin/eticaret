<!DOCTYPE html>
<html>
 <head>
     <meta charset='UTF-8'>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <style>
         *{
           margin: 0;
           padding: 0;
           box-sizing: border-box;
          }

          body{
            background-color:rgba(240, 242, 245, 1);
          }


         .eklnn{
           width:100px;
           height:30px;
           background-color:rgba(248, 248, 248, 1);
           color:rgba(68, 68, 68, 1);
           font-size:15px;
           text-align:center;
           padding:3px;
           border-radius:20px;
         }

         .eklnn:hover{
           box-shadow:3px 3px 3px red;
         }

          #magaza{
              display: flex;
              justify-content: center;
              align-items: center;
              gap: 30px;
              flex-wrap: wrap;
           }

          .urun-karti{
             color:rgba(255, 102, 0, 1);
             padding: 12px;
             text-align: center;
             width: 130px;
             height: 130px;
             background-color:rgba(255, 255, 255, 0.95);
             border:1px solid rgba(230, 230, 230, 1);
             border-radius: 10px;
             font-size: 17px;
             transition: transform 2s ease; 
             box-shadow:0 8px 20px rgba(0, 0, 0, 0.06);
           }

           #U{
              display: flex;
              justify-content: center;
              align-items: center;
              gap: 60px;
              background-color:rgba(255, 102, 0, 0.70);
              color:rgba(51, 51, 51, 1);
              font-size: 40px;
              flex-wrap: wrap;
           }

        .dropdown{
          display:inline-block;
          position:relative;
          z-index:1000;
          top:40px;
        }


           .urun-karti:hover{
              transform: scale(1.1);
              background-color:rgba(255, 102, 0, 0.25);
           }

           .bas-item{
              padding: 8px;
              text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.06);
              border-radius:10px;
           }

          #total{
            cursor:pointer;
          }

          .bas-item:hover{
              background-color:rgba(255, 102, 0, 1);
            }

          .ODM{
             position:fixed;
             right:20px;
             padding:8px;
             width:120px;
             height:90%;
             top:50px;
             border-radius:10px;
             text-align:center;
             background-color:rgba(255, 255, 255, 0.95);
             color:rgba(34, 34, 34, 1);
             display:none;
             

            }

          .odeme{
             background-color:rgba(0, 176, 116, 1);
             text-decoration:none;
             box-shadow:2px 2px 2px gray;
             border-radius:6px;
             width:70px;
             height:40px;
             padding:6px;
             color:rgba(255, 255, 255, 1);

           }

          .odeme:hover{
             background-color:rgba(0, 150, 98, 1);
             box-shadow:3px 3px 3px red;
           }

        .dropdown:hover .ODM{
           display:block;
           backdrop-filter: blur(8px);
           z-index:1000;
        }

        #but{
          padding:9px;
          border:none;
          border-radius:50%;
          width:60px;
          position:fixed;
          right:20px;
          bottom:40px;
          height:60px;
          color:red;
          background-color:rgba(255, 102, 0, 1);
        }

        #but:hover{
          background-color:rgba(230, 90, 0, 1);
        }

          @media (max-width:760px){
              #U{
                font-size:18px;
                position:sticky;
                top:0;
                z-index:1000;
                gap:15px;
                }
               .eklnn{
                 font-size:12px;
               }
           }

     </style>
 </head>
 <body>
   <div id='U'></div>
   <br>
   <div id='magaza'></div>
 <div class='dropdown'>
  <button id='but'>🛒</button>
  <div class='ODM'>
   <h4>SEPETİM</h4>
   <div id='EKLENEN'></div><br>
   <p id='total'></p><br>
   <a href='form.html' class='odeme'>ONAYLA</a>
  </div>
 </div>
 <script>  
    let divimiz = document.getElementById('magaza');
    let divimiz2 = document.getElementById('U');
    let tf = document.getElementById('total');
    let E = document.getElementById('EKLENEN');
   
   
    let totalfiyat = 0;

    let magaza = [
        {kategori:"GİYİM", urun:["Pantalon","Tişört","Mont"], fiyat:[100,200,300]},
        {kategori:"ELEKTRONİK", urun:["Kulaklık","Klavye","Televizyon", "Adaptör"], fiyat:[600,1000,10000,900]},
        {kategori:"SPOR", urun:["Bandaj","Dişlik","Jel", "Ayakkabı"], fiyat:[600,300,60,900]},
        {kategori:"BAKIM", urun:["D.Fırçası","Sabun","Havlu", "Parfüm"], fiyat:[100,60,130,1400]},
        {kategori:"TAKI", urun:["Kolye","Bileklik","Küpe", "Toka"], fiyat:[100,90,130,200]}
     ];

     for(let m of magaza){
           let yenikategori = document.createElement("div");

           yenikategori.innerText = m.kategori;

           divimiz2.appendChild(yenikategori);

           yenikategori.classList.add("bas-item");
           for(let i = 0; i < m.urun.length; i++){
               let yeniurun = document.createElement("div");
               yeniurun.innerHTML = "<br>" + m.kategori + "<br>" + m.urun[i] + "<br>" + "tl: " + m.fiyat[i];
               divimiz.appendChild(yeniurun);
               yeniurun.classList.add("urun-karti");
               yeniurun.addEventListener("click", function(){window.alert(m.urun[i] + " seçildi! Fiyatı: " + m.fiyat[i] + " TL"); 
                                         totalfiyat+=m.fiyat[i];
                                         tf.textContent=totalfiyat + "(tl)";
              				   let eklenen = document.createElement("p");
                                         eklenen.innerText = m.urun[i] + " (sil)";
                                         eklenen.classList.add("eklnn");
                                         E.appendChild(eklenen);
                                           
               eklenen.addEventListener("click", function(){
                    let yanit = window.prompt("sileceksen 1 yaz");
                    if(yanit == 1){
                       eklenen.remove();
                       totalfiyat -= m.fiyat[i];
                       tf.textContent = totalfiyat;
                    }
            })
            })
               
           }
     }
 </script>
 </body>
</html>
